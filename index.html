<style>

@media (prefers-color-scheme: dark) {
  :root { --ground: #1C1C1B; --ink: #EDECE8; --muted: #A3A19B; --rule: #3A3936; --sheet: #2A2A28; --note: #3A3527; --note-ink: #EFE6C4; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.wrap { max-width: 1480px; margin: 0 auto; padding: 32px 16px 96px; }
header h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
header p { margin: 6px 0 0; color: var(--muted); }
h2.group { margin: 56px 0 0; padding-bottom: 8px; border-bottom: 1px solid var(--rule); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
figure { margin: 32px 0 0; }
figcaption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; margin-bottom: 10px; font-size: 13px; }
figcaption span { color: var(--muted); font-variant-numeric: tabular-nums; }
figcaption a { color: inherit; }
.frame { position: relative; overflow: hidden; width: 100%; background: var(--sheet); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 10px 28px rgba(0,0,0,.07); }
.frame iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; background: #fff; }
.note { max-width: 560px; margin: 24px 0 0; padding: 14px 16px; background: var(--note); color: var(--note-ink); white-space: pre-line; font-size: 13px; }
</style>

<script>
function fit() {
  document.querySelectorAll("figure[data-w]").forEach(function (f) {
    var w = +f.dataset.w, h = +f.dataset.h;
    var s = Math.min(1, f.parentElement.clientWidth / w);
    var frame = f.querySelector(".frame");
    frame.style.width = (w * s) + "px";
    frame.style.height = (h * s) + "px";
    f.querySelector("iframe").style.transform = "scale(" + s + ")";
  });
}
addEventListener("resize", fit);
fit();
</script>
